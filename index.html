<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8" />
  </head>
  <body>
    <div class="header">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower matrix"/><a
        class="more-info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <div class="main-page">
      <p id="add-task"><label for="new-task">Add Item</label></p>
      <div class="add-task-form">
        <input id="new-task" class="task-input" type="text" /><button id="add-button">Add</button>
      </div>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li>
          <input type="checkbox" /><label class="task-label">Pay Bills</label
          ><input type="text" class="task-input" /><button class="edit-button">Edit</button
          ><button class="delete-button"><img src="./remove.svg" alt="remove"/></button>
        </li>
        <li class="edit-mode">
          <input type="checkbox" /><label class="task-label">Go Shopping</label
          ><input type="text" value="Go Shopping" class="task-input" /><button class="edit-button">Save</button
          ><button class="delete-button"><img src="./remove.svg" alt="remove"/></button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label class="task-label">See the Doctor</label
          ><input type="text" class="task-input" /><button class="edit-button">Edit</button
          ><button class="delete-button"><img src="./remove.svg" alt="remove"/></button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
